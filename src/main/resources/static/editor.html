<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比分编辑器</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="editor-header">
    <a href="/" class="back-link">← 返回首页</a>
    <h1 id="editor-title">比分编辑器</h1>
    <div id="save-status"></div>
    <div class="header-render-controls">
        <label for="scoreboard-template" class="field-label">模板</label>
        <select id="scoreboard-template">
            <option value="CLASSIC">经典转播</option>
            <option value="MODERN">现代电竞</option>
        </select>
        <div id="render-status" class="render-status">未开始</div>
        <div class="render-actions">
            <button id="start-render">导出MP4</button>
            <button id="cancel-render" class="secondary hidden">取消</button>
            <a id="download-render" class="hidden" href="#">下载 MP4</a>
        </div>
    </div>
</div>

<div class="editor-main">
    <div class="video-section">
        <div class="video-stage">
            <video id="match-video" controls preload="metadata"></video>
            <img id="scoreboard-preview" alt="比分牌预览">
        </div>
        <div class="video-info">
            <div class="info-line">
                <span id="video-time"></span>
                <span id="current-set"></span>
            </div>
            <div class="info-line">
                <span id="set-wins"></span>
                <span id="completed-sets"></span>
            </div>
        </div>
        <div class="first-server-row">
            <span class="field-label">先发球</span>
            <label class="radio-option"><input type="radio" name="first-server" value="A" checked>
                <span id="team-label-a">A 队</span></label>
            <label class="radio-option"><input type="radio" name="first-server" value="B"> <span id="team-label-b">B 队</span></label>
        </div>
        <div class="score-controls">
            <button id="score-a" class="score-btn">A 队得分</button>
            <button id="score-b" class="score-btn">B 队得分</button>
            <button id="undo-score" class="score-btn secondary">撤销得分</button>
        </div>
        <div class="hotkey-hints">
            <span>A - A队得分</span>
            <span>B/D - B队得分</span>
            <span>Z - 撤销得分</span>
            <span>空格 - 播放/暂停</span>
            <span>←/→ - 快退/快进</span>
        </div>
    </div>

    <div class="event-list-section">
        <div id="event-list"></div>
    </div>
</div>

<div id="event-modal" class="modal-overlay hidden">
    <div class="modal">
        <h2>编辑事件</h2>
        <form id="event-form">
            <input type="hidden" id="event-id">
            <div class="form-group">
                <label>时间（毫秒）</label>
                <input type="number" id="event-time-ms" required min="0">
            </div>
            <div class="form-group">
                <label>球员</label>
                <select id="event-player-side">
                    <option value="A">A</option>
                    <option value="B">B</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" id="modal-cancel" class="secondary">取消</button>
                <button type="submit" id="save-event">保存</button>
            </div>
        </form>
    </div>
</div>

<div id="delete-event-modal" class="modal-overlay hidden">
    <div class="modal">
        <h2>确认删除</h2>
        <p>确定要删除这个事件吗？</p>
        <div class="modal-actions">
            <button type="button" id="delete-cancel" class="secondary">取消</button>
            <button type="button" id="confirm-delete" class="danger">删除</button>
        </div>
    </div>
</div>

<div id="toast-host" class="toast-host"></div>
<script type="module" src="/js/editor.js"></script>
</body>
</html>
