<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频剪辑器</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="clip-editor-page">
<div class="editor-header clip-header">
    <a href="/" class="back-link">← 返回首页</a>
    <h1 id="clip-title">视频剪辑器</h1>
    <div class="clip-header-controls">
        <label class="field-label" for="clip-name">名称</label>
        <input type="text" id="clip-name" class="clip-name-input">
        <label class="field-label" for="clip-large-step">大步长</label>
        <input type="number" id="clip-large-step" min="1" value="10" class="clip-step-input">
        <label class="field-label" for="clip-small-step">小步长</label>
        <input type="number" id="clip-small-step" min="1" value="5" class="clip-step-input">
        <button id="clip-save-config" class="secondary">保存配置</button>
    </div>
    <div class="header-render-controls">
        <div id="clip-render-status" class="render-status">未开始</div>
        <div id="clip-output-path" class="render-output-path hidden"></div>
        <div class="render-actions">
            <button id="clip-export">导出MP4</button>
            <button id="clip-cancel-export" class="secondary hidden">取消</button>
            <a id="clip-download" class="hidden" href="#">下载 MP4</a>
        </div>
    </div>
</div>

<div id="clip-index-state" class="clip-index-state"></div>

<div class="clip-main">
    <section class="clip-strip-section">
        <div class="clip-section-title">当前帧</div>
        <div id="clip-strip" class="clip-strip"></div>
    </section>

    <section class="clip-timeline-section">
        <div class="clip-section-title">
            时间轴
            <span class="clip-section-hint">点击跳到任意源帧</span>
        </div>
        <div class="clip-meta">
            <span id="clip-frame-info">帧 -</span>
            <span id="clip-pending-info">暂选：无</span>
            <span id="clip-video-time"></span>
        </div>
        <div class="clip-timeline-wrap">
            <div id="clip-timeline" class="clip-timeline"></div>
            <div id="clip-timeline-cursor" class="clip-timeline-cursor"></div>
        </div>
        <div id="clip-timeline-ruler" class="clip-timeline-ruler"></div>
    </section>

    <section class="clip-segments-section">
        <div class="clip-section-title">
            已存档片段
            <span class="clip-section-hint">点击循环播放</span>
            <span id="clip-keep-summary" class="clip-section-hint"></span>
        </div>
        <div id="clip-segment-list" class="clip-segment-list"></div>
    </section>

    <section class="clip-stage-section">
        <div class="clip-stage">
            <video id="clip-video" controls preload="metadata"></video>
        </div>
        <section class="clip-keep-section">
            <div class="clip-section-title clip-keep-title">
                保留帧时间轴
                <span class="clip-section-hint">点击定位并只播放保留片段</span>
                <span id="clip-keep-duration" class="clip-keep-duration"></span>
            </div>
            <div class="clip-timeline-wrap">
                <div id="clip-keep-timeline" class="clip-timeline clip-keep-timeline"></div>
                <div id="clip-keep-timeline-cursor" class="clip-timeline-cursor hidden"></div>
            </div>
            <div id="clip-keep-timeline-ruler" class="clip-timeline-ruler"></div>
        </section>
        <div class="clip-hotkey-hints">
            <span>↑/↓ - 设为保留/舍弃并取大步长（切换时自动存档）</span>
            <span>→ - 追加小步长</span>
            <span>← - 暂选末尾减少小步长</span>
            <span>无暂选时 ←/→ 移动当前帧</span>
            <span>Enter - 存档暂选</span>
            <span>空格 - 播放/暂停</span>
        </div>
        <p class="clip-preview-note">
            预览按已存档的保留片段跳播，交界处可能与导出结果略有差异，导出以实际解码帧为准。
        </p>
    </section>
</div>

<div id="toast-host" class="toast-host"></div>
<script type="module" src="/js/clip-editor.js"></script>
</body>
</html>
